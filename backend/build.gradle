plugins {
    id 'java'
    id 'org.springframework.boot' version '4.1.0'
    id 'io.spring.dependency-management' version '1.1.7'
    id 'info.solidsoft.pitest' version '1.19.0'
}

group = 'withoutc'
version = '0.0.1-SNAPSHOT'
description = 'chong-chong'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(25)
    }
}

repositories {
    mavenCentral()
}

dependencies {
    implementation 'org.springframework.boot:spring-boot-starter-web'
    implementation 'org.springframework.boot:spring-boot-starter-restclient'
    implementation 'org.springframework.boot:spring-boot-starter-actuator'
    runtimeOnly 'io.micrometer:micrometer-registry-prometheus'
    implementation 'org.springframework.boot:spring-boot-starter-jdbc'
    implementation 'org.springframework.boot:spring-boot-starter-validation'
    implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
    implementation 'org.springframework.boot:spring-boot-starter-oauth2-resource-server'
    compileOnly 'org.projectlombok:lombok'
    annotationProcessor 'org.projectlombok:lombok'
    runtimeOnly 'org.postgresql:postgresql'
    implementation 'org.flywaydb:flyway-core'
    implementation 'org.springframework.boot:spring-boot-flyway'
    runtimeOnly 'org.flywaydb:flyway-database-postgresql'

    implementation platform('software.amazon.awssdk:bom:2.54.17')
    implementation 'software.amazon.awssdk:s3'

    implementation 'nl.martijndwars:web-push:5.1.1'
    implementation 'org.apache.httpcomponents:httpasyncclient:4.1.5'
    implementation 'org.bouncycastle:bcprov-jdk18on:1.86'
    implementation 'org.bitbucket.b_c:jose4j:0.9.6'

    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testImplementation 'org.springframework.boot:spring-boot-starter-webmvc-test'
    testImplementation 'org.springframework.security:spring-security-test'
    testImplementation 'io.rest-assured:rest-assured:6.0.1'
    testImplementation 'com.atlassian.oai:openapi-request-validator-restassured:3.0.0'
    testImplementation 'org.testcontainers:testcontainers-junit-jupiter:2.0.5'
    testImplementation 'org.testcontainers:testcontainers-postgresql:2.0.5'
    testRuntimeOnly 'com.h2database:h2'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

tasks.withType(Test).configureEach {
    systemProperty 'spring.test.context.cache.maxSize', '8'
    if (providers.gradleProperty('ci').isPresent()) {
        outputs.upToDateWhen { false }
        outputs.doNotCacheIf('CI에서는 테스트를 매번 실행한다') { true }
    }
}

tasks.named('test') {
    useJUnitPlatform {
        excludeTags 'openapi-coverage'
        // 변이 테스트 보강 루프용: ./gradlew test -PexcludeIntegration 으로 단위 테스트만 실행
        if (providers.gradleProperty('excludeIntegration').isPresent()) {
            excludeTags 'integration'
        }
    }
    systemProperty 'openapi.spec.path', layout.projectDirectory.file('docs/openapi/openapi.yaml').asFile.absolutePath
    systemProperty 'openapi.coverage.path', layout.buildDirectory.file('openapi/covered-operations.txt').get().asFile.absolutePath
    inputs.files(fileTree('docs/openapi') {
        include '**/*.yaml'
        exclude 'node_modules/**', 'dist/**'
    })
    outputs.file(layout.buildDirectory.file('openapi/covered-operations.txt'))
    doFirst {
        delete layout.buildDirectory.file('openapi/covered-operations.txt')
    }
    finalizedBy 'verifyOpenApiCoverage'
}

// 변이 테스트(로컬 전용): ./gradlew pitest
// 스프링 컨텍스트·DB 컨테이너를 띄우는 테스트는 변이마다 다시 떠서 느리므로 @Tag("integration")으로 제외하고 단위 테스트만 쓴다.
pitest {
    pitestVersion = '1.30.2'
    junit5PluginVersion = '1.2.3'
    // -PpitTargets=a.B,a.B$* 로 검사할 클래스를 좁힐 수 있다. (CI는 PR에서 바뀐 클래스만 넘긴다. scripts/mutation/changed-targets.sh)
    targetClasses = providers.gradleProperty('pitTargets')
            .map { it.split(',')*.trim().findAll { !it.isEmpty() } }
            .getOrElse(['withoutc.chongchong.*'])
    // 컨트롤러·설정·부트스트랩은 통합(API) 테스트 담당이라 단위 테스트 변이 점수에서 뺀다.
    excludedClasses = [
            'withoutc.chongchong.*.controller.*',
            'withoutc.chongchong.*.config.*',
            'withoutc.chongchong.ChongChongApplication',
    ]
    targetTests = ['withoutc.chongchong.*']
    excludedGroups = ['integration', 'openapi-coverage']
    threads = Runtime.runtime.availableProcessors()
    outputFormats = ['XML', 'HTML']
    timestampedReports = false
    // 바뀐 클래스가 인터페이스·레코드뿐이면 변이가 0개일 수 있다. 그때도 실패 대신 빈 결과를 남긴다.
    failWhenNoMutations = false
}

tasks.register('verifyOpenApiCoverage', Test) {
    description = 'Verifies that every OpenAPI operation has a successful HTTP test call.'
    group = 'verification'
    testClassesDirs = sourceSets.test.output.classesDirs
    classpath = sourceSets.test.runtimeClasspath
    useJUnitPlatform {
        includeTags 'openapi-coverage'
    }
    systemProperty 'openapi.spec.path', layout.projectDirectory.file('docs/openapi/openapi.yaml').asFile.absolutePath
    systemProperty 'openapi.coverage.path', layout.buildDirectory.file('openapi/covered-operations.txt').get().asFile.absolutePath
    inputs.files(fileTree('docs/openapi') {
        include '**/*.yaml'
        exclude 'node_modules/**', 'dist/**'
    })
    inputs.file(layout.buildDirectory.file('openapi/covered-operations.txt'))
    shouldRunAfter tasks.named('test')
    onlyIf {
        tasks.named('test').get().filter.commandLineIncludePatterns.empty &&
                !providers.gradleProperty('excludeIntegration').isPresent()
    }
}
