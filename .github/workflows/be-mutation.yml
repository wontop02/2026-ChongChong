name: Backend Mutation Test

# PIT 변이 테스트로 단위 테스트가 버그를 얼마나 잡는지 재고, 결과를 PR 댓글로 남긴다.
# PR에서는 바뀐 클래스(와 바뀐 테스트의 짝 클래스)만 검사한다. 수동 실행(workflow_dispatch)은 전체를 검사한다.
# 지금은 "리포트만" 단계라 점수가 낮아도 실패시키지 않는다. (be-ci.yml과 별도로 돈다)
on:
  pull_request:
    branches: [main, dev, prod]
    paths:
      - "backend/src/**"
      - "backend/build.gradle"
      - "backend/scripts/mutation/**"
      - ".github/workflows/be-mutation.yml"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: write

jobs:
  pitest:
    name: Mutation test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false
          fetch-depth: 2 # PR 머지 커밋과 그 첫 부모(기준 브랜치)를 비교하기 위해
      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "25"
      - name: Set up Gradle cache
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: ${{ github.event_name == 'pull_request' }}

      - name: Find changed classes
        id: targets
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            targets="$(scripts/mutation/changed-targets.sh HEAD^1)"
            if [ -z "$targets" ]; then
              echo "skip=true" >> "$GITHUB_OUTPUT"
            fi
            echo "targets=$targets" >> "$GITHUB_OUTPUT"
            echo "$targets" | tr ',' '\n' | grep -v '\$' > "$RUNNER_TEMP/targets.txt" || true
          fi

      # @Tag("integration") 테스트(스프링·DB)는 build.gradle의 pitest 설정에서 제외된다.
      - name: Run PIT
        if: steps.targets.outputs.skip != 'true'
        env:
          PIT_TARGETS: ${{ steps.targets.outputs.targets }}
        run: |
          if [ -n "$PIT_TARGETS" ]; then
            ./gradlew pitest -PpitTargets="$PIT_TARGETS"
          else
            ./gradlew pitest
          fi

      - name: Build report
        run: |
          out="$RUNNER_TEMP/mutation-comment.md"
          if [ "${{ steps.targets.outputs.skip }}" = "true" ]; then
            printf '## 🧬 변이 테스트 결과\n\n이번 PR에서 바뀐 검사 대상 클래스가 없어 건너뛰었습니다. (컨트롤러·설정·리포지토리는 통합 테스트 담당이라 대상이 아닙니다)\n' > "$out"
          else
            java scripts/mutation/PitReport.java comment > "$out"
            if [ -s "$RUNNER_TEMP/targets.txt" ]; then
              {
                printf '\n<details><summary>검사 범위: 이번 PR에서 바뀐 클래스 %s개</summary>\n\n```\n' "$(wc -l < "$RUNNER_TEMP/targets.txt" | tr -d ' ')"
                sed 's/^withoutc\.chongchong\.//' "$RUNNER_TEMP/targets.txt"
                printf '```\n\n</details>\n'
              } >> "$out"
            fi
          fi
          cat "$out" >> "$GITHUB_STEP_SUMMARY"

      # fork에서 온 PR은 토큰에 쓰기 권한이 없으므로 댓글을 건너뛴다. (결과는 Actions 요약에서 볼 수 있다)
      - name: Comment on PR
        if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
        uses: marocchino/sticky-pull-request-comment@v2
        with:
          header: mutation-test
          path: ${{ runner.temp }}/mutation-comment.md

      - name: Upload PIT report
        if: always() && steps.targets.outputs.skip != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: backend-pitest-report
          path: backend/build/reports/pitest/
          retention-days: 7
